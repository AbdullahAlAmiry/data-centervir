        }

            font-size: 0.98rem;
            color: #34495e;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--accent);
            background-color: #f8fafc;
        }

        .option-item.disabled {
            cursor: default;
        }

        .opt-en {
            direction: ltr;
            text-align: left;
            font-weight: 500;
        }

        .opt-ar {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .option-item.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
        }

        .option-item.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

            margin-top: 14px;
            padding: 12px 15px;
            background-color: #eef7fe;
            border-right: 4px solid var(--accent);
            border-radius: 6px;
            font-size: 0.92rem;
            line-height: 1.6;

            margin-top: 12px;
            padding: 14px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;

            border: none;
            padding: 7px 14px;
            border-radius: 6px;

</head>

function renderQuiz() {
    const container = document.getElementById('quiz-body');
    document.getElementById('total').innerText = mcqQuestions.length;
    let currentQuizSection = "";

    mcqQuestions.forEach((q, qIndex) => {
        if (q.quiz !== currentQuizSection) {
            currentQuizSection = q.quiz;
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'quiz-section-title';
            sectionHeader.innerText = currentQuizSection;
            container.appendChild(sectionHeader);
        }

        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = "";
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <li class="option-item" onclick="selectOption(${qIndex}, ${optIndex})" id="opt-${qIndex}-${optIndex}">
                    <div class="opt-en">${opt.en}</div>
                    <div class="opt-ar">${opt.ar}</div>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-num">سؤال اختيارات ${qIndex + 1}</div>
            <div class="question-text-en">${q.qEn}</div>
            <div class="question-text-ar">${q.qAr}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation" id="exp-${qIndex}">
                <strong>الشرح والسبب العلمي:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    const essayHeader = document.createElement('h2');
    essayHeader.className = 'quiz-section-title';
    essayHeader.innerText = "أسئلة المقالي والأسئلة النظرية الشاملة (Essay Questions)";
    container.appendChild(essayHeader);

    essayQuestions.forEach((eq, eqIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
            <div class="question-num">${eq.quiz}</div>
            <div class="question-text-en">${eq.qEn}</div>
            <div class="question-text-ar">${eq.qAr}</div>
            <button class="btn-toggle" onclick="toggleEssayAnswer(${eqIndex})">إظهار الإجابة النموذجية</button>
            <div class="essay-answer" id="essay-ans-${eqIndex}">${eq.answer}</div>
        `;
        container.appendChild(card);
    });
}

let userScore = 0;
const answeredQuestions = new Set();

function selectOption(qIndex, selectedIndex) {
    if (answeredQuestions.has(qIndex)) return;

    answeredQuestions.add(qIndex);
    const qData = mcqQuestions[qIndex];
    const isCorrect = selectedIndex === qData.correct;

    const selectedElem = document.getElementById(`opt-${qIndex}-${selectedIndex}`);
    const correctElem = document.getElementById(`opt-${qIndex}-${qData.correct}`);

    for (let i = 0; i < qData.options.length; i++) {
        document.getElementById(`opt-${qIndex}-${i}`).classList.add('disabled');
    }

    if (isCorrect) {
        selectedElem.classList.add('correct');
        userScore++;
    } else {
        selectedElem.classList.add('wrong');
        correctElem.classList.add('correct');
    }

    document.getElementById('score').innerText = userScore;
    document.getElementById(`exp-${qIndex}`).style.display = 'block';
}

function toggleEssayAnswer(index) {
    const ansElem = document.getElementById(`essay-ans-${index}`);
    ansElem.style.display = (ansElem.style.display === 'block') ? 'none' : 'block';
}

function resetQuiz() {
    userScore = 0;
    answeredQuestions.clear();
    document.getElementById('score').innerText = '0';
    document.getElementById('quiz-body').innerHTML = '';
    renderQuiz();
}

window.onload = renderQuiz;
</script>
